<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure Lo-Fi Study Cafe portfolio demo">
  <title>Welcome Back | Secure Lo-Fi Study Cafe</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="cafe-icon" aria-hidden="true">☕</div>
      <h1 id="login-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to enter your cozy study room.</p>

      <div id="auth-error" class="alert" role="alert" hidden></div>

      <form id="auth-form" data-auth-mode="login" class="stack-form">
        <label>
          Username
          <input id="username" name="username" autocomplete="username" required>
        </label>

        <label>
          Password
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Your password" required>
        </label>

        <div>
          <button class="button primary" type="submit">Log In</button>
        </div>

        <p class="auth-switch">Need an account? <a href="./register.html">Register</a></p>
      </form>

      <p class="security-note">GitHub Pages demo: account state stays in this browser only. The real project uses Express sessions, bcrypt, SQLite, CSRF checks, and server-side role enforcement.</p>
    </section>
  </main>

  <script src="./auth.js"></script>
</body>
</html>
