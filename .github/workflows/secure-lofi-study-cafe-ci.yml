name: Validate Secure Lo-Fi Study Cafe

on:
  push:
    branches:
      - main
    paths:
      - "secure-lofi-study-cafe/**"
      - "Dockerfile"
      - ".github/workflows/secure-lofi-study-cafe-ci.yml"
  pull_request:
    paths:
      - "secure-lofi-study-cafe/**"
      - "Dockerfile"
      - ".github/workflows/secure-lofi-study-cafe-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-lofi-study-cafe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies for validation
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check database.js
          node --check sqlite-session-store.js
          node --check public/cafe.js
          node --check public/admin.js
          node --check demo/auth.js
          node --check demo/demo.js
          node --check demo/admin-demo.js
          node --check scripts/security-smoke-test.js

      - name: Compile EJS templates
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const ejs = require("ejs");
          for (const file of ["views/register.ejs", "views/login.ejs", "views/cafe.ejs", "views/admin.ejs", "views/security.ejs"]) {
            ejs.compile(fs.readFileSync(file, "utf8"), { filename: file });
            console.log("Compiled:", file);
          }
          NODE

      - name: Check self-host deployment shell scripts
        run: |
          bash -n deploy/scripts/install-self-hosted.sh
          bash -n deploy/scripts/backup-sqlite.sh
          bash -n deploy/scripts/restore-sqlite.sh
          bash -n deploy/scripts/healthcheck.sh

      - name: Verify self-hosted SQLite security schema and indexes
        run: npm run test:security

      - name: Build production container
        run: docker build -f ../Dockerfile ..
